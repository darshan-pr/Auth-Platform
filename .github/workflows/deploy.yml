name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: authplatform
        run: ./mvnw -B test

  frontend:
    name: SDK packages and console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: SDK packages
        run: |
          npm ci
          npm test
      - name: Console
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy to AWS
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    # Deploys never run in parallel; a newer push waits for the current one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
      SSM_PREFIX: /authplatform/prod
      INSTANCE_NAME: authplatform-prod-app
      DEPLOY_DOCUMENT: authplatform-prod-deploy
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Point the instance at this commit
        run: |
          aws ssm put-parameter --name "$SSM_PREFIX/git_ref" --type String \
            --value "$GITHUB_SHA" --overwrite > /dev/null
          echo "Deploying $GITHUB_SHA"

      - name: Run the deploy on the instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ "$(echo "$INSTANCE_ID" | wc -w)" -ne 1 ]; then
            echo "Expected exactly one running instance named $INSTANCE_NAME, found: '$INSTANCE_ID'" >&2
            exit 1
          fi
          COMMAND_ID=$(aws ssm send-command --document-name "$DEPLOY_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" --timeout-seconds 60 \
            --comment "GitHub deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "Command $COMMAND_ID on $INSTANCE_ID"
          STATUS=InProgress
          for _ in $(seq 1 150); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify the public site
        run: |
          for i in $(seq 1 12); do
            LOGIN=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/sa/login" || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Requested-With: authplatform-console' "$APP_URL/api/console/csrf" || true)
            echo "attempt $i: login=$LOGIN csrf=$API"
            if [ "$LOGIN" = "200" ] && [ "$API" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Public site did not become healthy" >&2
          exit 1
